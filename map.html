<title>Monadnock Region Rail Trail Map</title>
<style>
/* required styles */

.leaflet-pane,
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-tile-container,
.leaflet-pane > svg,
.leaflet-pane > canvas,
.leaflet-zoom-box,
.leaflet-image-layer,
.leaflet-layer {
	position: absolute;
	left: 0;
	top: 0;
	}
.leaflet-container {
	overflow: hidden;
	}
.leaflet-tile,
.leaflet-marker-icon,
.leaflet-marker-shadow {
	-webkit-user-select: none;
	   -moz-user-select: none;
	        user-select: none;
	  -webkit-user-drag: none;
	}
/* Prevents IE11 from highlighting tiles in blue */
.leaflet-tile::selection {
	background: transparent;
}
/* Safari renders non-retina tile on retina better with this, but Chrome is worse */
.leaflet-safari .leaflet-tile {
	image-rendering: -webkit-optimize-contrast;
	}
/* hack that prevents hw layers "stretching" when loading new tiles */
.leaflet-safari .leaflet-tile-container {
	width: 1600px;
	height: 1600px;
	-webkit-transform-origin: 0 0;
	}
.leaflet-marker-icon,
.leaflet-marker-shadow {
	display: block;
	}
/* .leaflet-container svg: reset svg max-width decleration shipped in Joomla! (joomla.org) 3.x */
/* .leaflet-container img: map is broken in FF if you have max-width: 100% on tiles */
.leaflet-container .leaflet-overlay-pane svg {
	max-width: none !important;
	max-height: none !important;
	}
.leaflet-container .leaflet-marker-pane img,
.leaflet-container .leaflet-shadow-pane img,
.leaflet-container .leaflet-tile-pane img,
.leaflet-container img.leaflet-image-layer,
.leaflet-container .leaflet-tile {
	max-width: none !important;
	max-height: none !important;
	width: auto;
	padding: 0;
	}

.leaflet-container img.leaflet-tile {
	/* See: https://bugs.chromium.org/p/chromium/issues/detail?id=600120 */
	mix-blend-mode: plus-lighter;
}

.leaflet-container.leaflet-touch-zoom {
	-ms-touch-action: pan-x pan-y;
	touch-action: pan-x pan-y;
	}
.leaflet-container.leaflet-touch-drag {
	-ms-touch-action: pinch-zoom;
	/* Fallback for FF which doesn't support pinch-zoom */
	touch-action: none;
	touch-action: pinch-zoom;
}
.leaflet-container.leaflet-touch-drag.leaflet-touch-zoom {
	-ms-touch-action: none;
	touch-action: none;
}
.leaflet-container {
	-webkit-tap-highlight-color: transparent;
}
.leaflet-container a {
	-webkit-tap-highlight-color: rgba(51, 181, 229, 0.4);
}
.leaflet-tile {
	filter: inherit;
	visibility: hidden;
	}
.leaflet-tile-loaded {
	visibility: inherit;
	}
.leaflet-zoom-box {
	width: 0;
	height: 0;
	-moz-box-sizing: border-box;
	     box-sizing: border-box;
	z-index: 800;
	}
/* workaround for https://bugzilla.mozilla.org/show_bug.cgi?id=888319 */
.leaflet-overlay-pane svg {
	-moz-user-select: none;
	}

.leaflet-pane         { z-index: 400; }

.leaflet-tile-pane    { z-index: 200; }
.leaflet-overlay-pane { z-index: 400; }
.leaflet-shadow-pane  { z-index: 500; }
.leaflet-marker-pane  { z-index: 600; }
.leaflet-tooltip-pane   { z-index: 650; }
.leaflet-popup-pane   { z-index: 700; }

.leaflet-map-pane canvas { z-index: 100; }
.leaflet-map-pane svg    { z-index: 200; }

.leaflet-vml-shape {
	width: 1px;
	height: 1px;
	}
.lvml {
	behavior: url(#default#VML);
	display: inline-block;
	position: absolute;
	}


/* control positioning */

.leaflet-control {
	position: relative;
	z-index: 800;
	pointer-events: visiblePainted; /* IE 9-10 doesn't have auto */
	pointer-events: auto;
	}
.leaflet-top,
.leaflet-bottom {
	position: absolute;
	z-index: 1000;
	pointer-events: none;
	}
.leaflet-top {
	top: 0;
	}
.leaflet-right {
	right: 0;
	}
.leaflet-bottom {
	bottom: 0;
	}
.leaflet-left {
	left: 0;
	}
.leaflet-control {
	float: left;
	clear: both;
	}
.leaflet-right .leaflet-control {
	float: right;
	}
.leaflet-top .leaflet-control {
	margin-top: 10px;
	}
.leaflet-bottom .leaflet-control {
	margin-bottom: 10px;
	}
.leaflet-left .leaflet-control {
	margin-left: 10px;
	}
.leaflet-right .leaflet-control {
	margin-right: 10px;
	}


/* zoom and fade animations */

.leaflet-fade-anim .leaflet-popup {
	opacity: 0;
	-webkit-transition: opacity 0.2s linear;
	   -moz-transition: opacity 0.2s linear;
	        transition: opacity 0.2s linear;
	}
.leaflet-fade-anim .leaflet-map-pane .leaflet-popup {
	opacity: 1;
	}
.leaflet-zoom-animated {
	-webkit-transform-origin: 0 0;
	    -ms-transform-origin: 0 0;
	        transform-origin: 0 0;
	}
svg.leaflet-zoom-animated {
	will-change: transform;
}

.leaflet-zoom-anim .leaflet-zoom-animated {
	-webkit-transition: -webkit-transform 0.25s cubic-bezier(0,0,0.25,1);
	   -moz-transition:    -moz-transform 0.25s cubic-bezier(0,0,0.25,1);
	        transition:         transform 0.25s cubic-bezier(0,0,0.25,1);
	}
.leaflet-zoom-anim .leaflet-tile,
.leaflet-pan-anim .leaflet-tile {
	-webkit-transition: none;
	   -moz-transition: none;
	        transition: none;
	}

.leaflet-zoom-anim .leaflet-zoom-hide {

	}

.leaflet-interactive {

.leaflet-grab {

.leaflet-popup-pane,

.leaflet-marker-icon,
.leaflet-marker-shadow,
.leaflet-image-layer,
.leaflet-pane > svg path,
.leaflet-tile-container {

	}

.leaflet-marker-icon.leaflet-interactive,

.leaflet-pane > svg path.leaflet-interactive,
svg.leaflet-image-layer.leaflet-interactive path {

/* visual tweaks */

.leaflet-container {

	}

	}
.leaflet-zoom-box {

	}


/* general typography */
.leaflet-container {
	font-family: "Helvetica Neue", Arial, Helvetica, sans-serif;
	font-size: 12px;
	font-size: 0.75rem;
	line-height: 1.5;
	}


/* general toolbar styles */

.leaflet-bar {
	box-shadow: 0 1px 5px rgba(0,0,0,0.65);
	border-radius: 4px;
	}
.leaflet-bar a {
	background-color: #fff;
	border-bottom: 1px solid #ccc;
	width: 26px;
	height: 26px;
	line-height: 26px;
	display: block;
	text-align: center;
	text-decoration: none;
	color: black;
	}
.leaflet-bar a,
.leaflet-control-layers-toggle {
	background-position: 50% 50%;

	display: block;
	}
.leaflet-bar a:hover,
.leaflet-bar a:focus {
	background-color: #f4f4f4;
	}
.leaflet-bar a:first-child {
	border-top-left-radius: 4px;

	}
.leaflet-bar a:last-child {

	}

.leaflet-touch .leaflet-bar a {

.leaflet-touch .leaflet-control-zoom-in, .leaflet-touch .leaflet-control-zoom-out  {

/* layers control */

.leaflet-control-layers {

.leaflet-control-layers-toggle {

.leaflet-touch .leaflet-control-layers-toggle {

.leaflet-control-layers .leaflet-control-layers-list,

/* attribution and scale controls */

.leaflet-container .leaflet-control-attribution {

.leaflet-control-attribution,

.leaflet-control-scale-line:not(:first-child) {

.leaflet-touch .leaflet-control-attribution,

.leaflet-touch .leaflet-control-layers,

/* popup */

.leaflet-popup {

.leaflet-popup-content-wrapper {

	   -moz-transform: rotate(45deg);
	    -ms-transform: rotate(45deg);

.leaflet-popup-content-wrapper,
.leaflet-popup-tip {

.leaflet-container a.leaflet-popup-close-button {

.leaflet-popup-scrolled {

.leaflet-oldie .leaflet-popup-content-wrapper {

	}
.leaflet-oldie .leaflet-popup-tip {

	-ms-filter: "progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678)";
	filter: progid:DXImageTransform.Microsoft.Matrix(M11=0.70710678, M12=0.70710678, M21=-0.70710678, M22=0.70710678);

.leaflet-oldie .leaflet-control-zoom,

/* div icon */

.leaflet-div-icon {

/* Tooltip */
/* Base styles for the element that has a tooltip */
.leaflet-tooltip {
	position: absolute;
	padding: 6px;
	background-color: #fff;
	border: 1px solid #fff;

	color: #222;

.leaflet-tooltip.leaflet-interactive {

.leaflet-tooltip-top:before,
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-left:before,
.leaflet-tooltip-right:before {
	position: absolute;
	pointer-events: none;
	border: 6px solid transparent;
	background: transparent;
	content: "";
	}

/* Directions */

.leaflet-tooltip-bottom {
	margin-top: 6px;
}
.leaflet-tooltip-top {
	margin-top: -6px;
}
.leaflet-tooltip-bottom:before,
.leaflet-tooltip-top:before {

<style>
:root{
  --land:#E7ECCF; --park:#D3DFB3; --frame:#A58F6A; --plaque:#6F7B4A; --navy:#1F3A5F; --ink:#26362A;
  --rehab:#3F8F52; --progress:#E8B923; --planned:#B4483C; --sub:#EEF1DC;
  --font:"Helvetica Neue",Helvetica,Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--land);font-family:var(--font);color:var(--ink);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit}
:focus-visible{outline:3px solid var(--navy);outline-offset:2px}

/* Frame: speckled tan band, land inside, compass circles on the edges */
.frame{position:fixed;inset:6px;border:10px dotted var(--frame);border-radius:16px;background:var(--land)}
.stage{position:absolute;inset:0;border-radius:6px;overflow:hidden}
#map{position:absolute;inset:0;isolation:isolate;background:var(--land);font:inherit}
.compass{position:absolute;z-index:6;width:24px;height:24px;border-radius:50%;background:var(--navy);border:1.5px solid #fff;
  color:#fff;font:700 11px/21px var(--font);text-align:center;pointer-events:none}
.compass.n{top:-17px;left:calc(50% - 12px)} .compass.s{bottom:-17px;left:calc(50% - 12px)}
.compass.w{left:-17px;top:calc(50% - 12px)} .compass.e{right:-17px;top:calc(50% - 12px)}

/* Title plaque */
.plaque{position:absolute;z-index:4;top:12px;left:12px;background:var(--plaque);border-radius:10px;padding:7px 14px 8px;pointer-events:none}
.plaque b{display:block;color:#fff;font-size:15px;line-height:20px}
.plaque span{display:block;color:var(--sub);font-size:11px;line-height:15px}

/* Layer chips */
.chips{position:absolute;z-index:4;top:66px;left:12px;right:12px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;display:inline-flex;align-items:center;gap:6px;min-height:36px;padding:6px 10px;border-radius:999px;
  background:#fff;border:1px solid var(--frame);font-size:12.5px;font-weight:600;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--plaque);border-color:var(--plaque);color:#fff}
.chip i{display:inline-block;flex:none}
.g-trail{width:18px;height:8px;border-radius:4px;background:var(--rehab);border:1.5px solid #fff}
.g-parking{width:14px;height:14px;border-radius:50%;background:var(--navy);border:1.5px solid #fff;font:700 9px/11px var(--font);color:#fff;text-align:center;font-style:normal}
.g-bridge{width:11px;height:11px;border-radius:50%;background:var(--progress);border:1.5px solid var(--ink)}
.g-biz{width:12px;height:12px;border-radius:50%;background:var(--plaque);border:1.5px solid #fff}
.chip[aria-pressed="false"] .g-biz{border-color:var(--frame)}

/* Legend */
.legend{position:absolute;z-index:4;left:12px;bottom:14px;display:flex;gap:10px;align-items:center;background:#fff;
  border:1px solid var(--frame);border-radius:8px;padding:6px 10px;font-size:11px;line-height:16px;max-width:calc(100% - 56px);flex-wrap:nowrap;pointer-events:none}
.legend span{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.sw{display:inline-block;width:18px;height:5px;border-radius:3px}
.sw.rehab{background:var(--rehab)} .sw.progress{background:var(--progress)}
.sw.planned{background:repeating-linear-gradient(90deg,var(--planned) 0 6px,transparent 6px 9px)}

/* Map controls */
.leaflet-top.leaflet-right{margin-top:0}
.leaflet-bar{box-shadow:none!important;border:1px solid var(--frame)!important;border-radius:8px!important;overflow:hidden;background:#fff}
.leaflet-bar a,.leaflet-bar button.loc{width:36px;height:36px;line-height:34px;color:var(--ink);font-size:20px;border:0;border-bottom:1px solid #e6e1d3;background:#fff;display:block;text-align:center;text-decoration:none;cursor:pointer}
.leaflet-bar a:last-child,.leaflet-bar button.loc:last-child{border-bottom:0}
.leaflet-bottom.leaflet-right{bottom:48px}
.leaflet-control-attribution{margin:0 6px 4px 0!important;border-radius:4px;font-size:11px;background:rgba(255,255,255,.85)!important;color:var(--ink)}
.leaflet-control-attribution a{color:var(--ink)}
.leaflet-touch .leaflet-bar a{width:36px;height:36px;line-height:34px}
.basemap{mix-blend-mode:multiply;filter:grayscale(.4) contrast(1.5)}
.leaflet-container{background:var(--land)!important;font-family:var(--font)}
@media (max-width:899px){ .leaflet-control-zoom{display:none} }

/* Town and state labels (HTML so they render offline) */
.town{position:absolute;left:0;top:0;width:0;height:0;pointer-events:none}
.leaflet-div-icon{background:none;border:0}
.town .dot{position:absolute;left:-4.5px;top:-4.5px;width:9px;height:9px;border-radius:50%;background:#fff;border:1.5px solid var(--ink)}
.town .lbl{position:absolute;white-space:nowrap;font:700 12px/14px var(--font);color:var(--ink);
  text-shadow:-1.5px 0 var(--land),1.5px 0 var(--land),0 -1.5px var(--land),0 1.5px var(--land),0 0 4px var(--land)}
.lbl.p-r{left:9px;top:-7px} .lbl.p-l{right:9px;top:-7px} .lbl.p-t{left:0;bottom:8px;transform:translateX(-50%)} .lbl.p-b{left:0;top:8px;transform:translateX(-50%)}
.stname{position:absolute;pointer-events:none;white-space:nowrap;font:italic 12px/14px var(--font);letter-spacing:.08em;color:#7C8B6B;
  text-shadow:-1.5px 0 var(--land),1.5px 0 var(--land),0 -1.5px var(--land),0 1.5px var(--land)}

.rt{position:absolute;left:0;top:0;pointer-events:none}
.rt span{position:absolute;transform:translate(-50%,-50%);white-space:nowrap;background:#fff;border:1px solid #CDB97F;border-radius:5px;padding:0 5px;font:700 11px/16px var(--font);color:var(--ink)}
.z-rt .rt{display:none}
.stname.c{transform:translate(-50%,-50%)} .stname.l{transform:translate(0,-50%)}
.pk{position:absolute;left:-11px;top:-11px;width:22px;height:22px;border-radius:50%;background:var(--navy);border:2px solid #fff;
  color:#fff;font:700 12px/18px var(--font);text-align:center;cursor:pointer}
.pk::after{content:"";position:absolute;inset:-9px;border-radius:50%}
.z-lo .pk{left:-5px;top:-5px;width:10px;height:10px;border-width:1.5px;font-size:0;line-height:0}
.z-lo .pk::after{inset:-13px}

/* Detail card: bottom sheet on phones, floating card on desktop */
.card{position:absolute;z-index:10;left:10px;right:10px;bottom:10px;background:#fff;border:1px solid var(--frame);border-radius:12px;
  padding:14px 52px 14px 16px;display:none}
.card.open{display:block;animation:rise .16s ease-out}
.card h2{margin:0 0 6px;font-size:17px;line-height:22px}
.card p{margin:0;font-size:14px;line-height:20px}
.card .status{display:flex;align-items:center;gap:8px}
.card .go{display:inline-flex;align-items:center;min-height:40px;margin-top:10px;padding:0 14px;border-radius:999px;background:var(--navy);color:#fff;font-size:14px;font-weight:600;text-decoration:none}
.card .x{position:absolute;top:6px;right:6px;width:40px;height:40px;border:0;border-radius:50%;background:transparent;font-size:24px;line-height:40px;cursor:pointer}
.card .x:hover{background:var(--land)}
@keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}

.toast{position:absolute;z-index:9;left:50%;top:112px;transform:translateX(-50%);max-width:calc(100% - 32px);background:var(--ink);color:#fff;
  border-radius:10px;padding:10px 14px;font-size:13px;line-height:18px;display:none}
.toast.open{display:block}

@media (max-width:899px){
}
@media (min-width:900px){
  .plaque{top:14px;left:14px}
  .chips{top:14px;left:200px;right:70px;height:44px;align-items:center;overflow:visible}
  .legend{left:14px;bottom:16px;gap:14px}
  .sw{width:22px}
  .card{left:auto;right:14px;top:166px;bottom:auto;width:320px}
  .toast{top:70px}
}
@media (prefers-reduced-motion:reduce){.card.open{animation:none}}
</style>
</head>
<body>
<div class="frame">
  <div class="stage">
    <div id="map" role="application" aria-label="Interactive map of Monadnock region rail trails"></div>

    <div class="plaque"><b>Monadnock region</b><span>Rail trail network</span></div>

    <div class="chips" role="group" aria-label="Map layers">
      <button class="chip" data-layer="trails" aria-pressed="true"><i class="g-trail"></i>Trails</button>
      <button class="chip" data-layer="parking" aria-pressed="false"><i class="g-parking">P</i>Parking</button>
      <button class="chip" data-layer="bridges" aria-pressed="false"><i class="g-bridge"></i>Bridges</button>
      <button class="chip" data-layer="biz" aria-pressed="false"><i class="g-biz"></i>Businesses</button>
    </div>

    <div class="legend" aria-label="Trail status legend">
      <span><i class="sw rehab"></i>Rehabilitated</span>
      <span><i class="sw progress"></i>In progress</span>
      <span><i class="sw planned"></i>Unplanned</span>
    </div>

    <div class="card" id="card" role="region" aria-live="polite" aria-label="Details">
      <button class="x" id="close" aria-label="Close details">&times;</button>
      <h2 id="c-title"></h2>
      <div id="c-body"></div>
    </div>
    <div class="toast" id="toast" role="status"></div>
  </div>
  <div class="compass n">N</div><div class="compass e">E</div><div class="compass s">S</div><div class="compass w">W</div>
</div>

let vecOK=false;
const SAGE={water:'#B5D9DF',park:'#D3DFB3'};
const RD={ // class: [min zoom, casing, fill, width stops [zoom,px]]
  motorway:[0,'#B9A15E','#EBD28C',[[6,1.4],[9,2.4],[12,3.8],[14,5.4]]],
  trunk:[0,'#BFA962','#EDD895',[[6,1.2],[9,2.2],[12,3.6],[14,5.2]]],

  secondary:[8,'#D2C393','#F6EBC4',[[8,1],[10,1.6],[12,2.8],[14,4.2]]],
  tertiary:[10,'#D8D1B0','#FBF7E6',[[10,1],[12,2],[14,3.4]]],
  minor:[12,'#DAD6BC','#FFFFFF',[[12,1],[13,1.6],[14,2.6]]],
  service:[14,'#E0DCC6','#FBFAF3',[[14,1.4]]]
};
const VSTYLES={
  water:{fill:true,fillColor:SAGE.water,fillOpacity:1,stroke:false,weight:0},
  park:{fill:true,fillColor:SAGE.park,fillOpacity:.9,stroke:false,weight:0},
  waterway:(p,z)=>{ const big=p.class==='river'||p.class==='canal'; if(!big&&z<13) return [];
    return {color:SAGE.water,weight:lerp(z,big?[[8,1],[12,2.6],[14,4]]:[[13,1],[14,1.6]]),opacity:1,lineCap:'round',lineJoin:'round',fill:false}; },
  transportation:(p,z)=>{ const d=RD[p.class]; if(!d||z<d[0]||p.brunnel==='tunnel'||p.ramp===1) return [];
    const w=lerp(z,d[3]);
    return [{color:d[1],weight:w+1.8,opacity:1,lineCap:'round',lineJoin:'round',fill:false},
            {color:d[2],weight:w,opacity:1,lineCap:'round',lineJoin:'round',fill:false}]; }
};
function startBasemap(){
  const ctl=new AbortController(), timer=setTimeout(()=>ctl.abort(),8000);
  fetch('https://tiles.openfreemap.org/planet',{signal:ctl.signal}).then(r=>{ clearTimeout(timer); if(!r.ok) throw new Error('tilejson'); return r.json(); })
  .then(tj=>{
    const url=tj.tiles&&tj.tiles[0]; if(!url) throw new Error('no tiles');
    const vec=L.vectorGrid.protobuf(url,{pane:'basemap',rendererFactory:L.canvas.tile,maxNativeZoom:Math.min(14,tj.maxzoom||14),maxZoom:17,interactive:false,vectorTileLayerStyles:VSTYLES}).addTo(map);
    vec.on('tileerror',()=>{ if(!warned){ warned=true; say('Some street tiles did not load.'); } });
    vec.once('load',()=>{ vecOK=true; restyle(); L.control.attribution({prefix:false,position:'bottomright'}).addAttribution('&copy; OpenFreeMap &copy; OpenMapTiles &copy; OpenStreetMap').addTo(map); });
  }).catch(()=>say('Street detail needs a connection that allows map tiles. Major roads, trails, and pins still work.'));
}
setTimeout(startBasemap,0);

})();

// State lines
L.geoJSON(BORDERS,{pane:'borders',interactive:false,style:{color:C.stateLine,weight:2,dashArray:'7 6',opacity:1}}).addTo(map);

// Trails
const groups={trails:L.layerGroup(),parking:L.layerGroup(),bridges:L.layerGroup(),biz:L.layerGroup()};
const byStatus={planned:[],progress:[],rehab:[]}, hits=[];
const ordered=['planned','progress','rehab'], feats=D.trails.features;
ordered.forEach(st => feats.filter(f=>f.properties.status===st).forEach(f=>{
  const line=L.polyline(f.geometry.coordinates.map(ll),{color:COLOR[st],weight:4,lineCap:st==='planned'?'butt':'round',lineJoin:'round',interactive:false,smoothFactor:1.2});
  byStatus[st].push(line); groups.trails.addLayer(line);
}));
feats.forEach(f=>{
  const h=L.polyline(f.geometry.coordinates.map(ll),{weight:24,opacity:0.01,bubblingMouseEvents:false,smoothFactor:1.5});
  h.on('click',e=>openCard({kind:'trail',p:f.properties,coords:f.geometry.coordinates},e.latlng)); hits.push(h); groups.trails.addLayer(h);
});
groups.trails.addTo(map);

// Pins
const bridgeDots=[], bizDots=[];
function dotPin(feat,kind,group,store,rs,style){
  const p=feat.properties, pos=ll(feat.geometry.coordinates);
  const dot=L.circleMarker(pos,Object.assign({pane:'pins',radius:rs[0][1],fillOpacity:1,interactive:false},style)); store.push(dot);
  const hit=L.circleMarker(pos,{pane:'pins',radius:14,opacity:0,fillOpacity:0.01,bubblingMouseEvents:false});
  hit.on('click',()=>openCard({kind,p,geom:feat.geometry},L.latLng(pos)));
  group.addLayer(dot); group.addLayer(hit);
}
D.bridges.features.forEach(f=>dotPin(f,'bridges',groups.bridges,bridgeDots,RBR,{color:C.ink,weight:1.2,fillColor:COLOR[f.properties.status]||C.frame}));
D.biz.features.forEach(f=>dotPin(f,'biz',groups.biz,bizDots,RBZ,{color:'#fff',weight:1.5,fillColor:C.plaque}));
D.parking.features.forEach(f=>{
  const pos=ll(f.geometry.coordinates);
  const m=L.marker(pos,{icon:L.divIcon({className:'',html:'<span class="pk">P</span>',iconSize:[0,0]}),keyboard:false,bubblingMouseEvents:false,riseOnHover:false});
  m.on('click',()=>openCard({kind:'parking',p:f.properties,geom:f.geometry},L.latLng(pos)));
  groups.parking.addLayer(m);
});

// Towns and state names (approximate positions, anchored to depots/parking in the KML)

TOWNS.forEach(([n,x,y,pos]) => L.marker([y,x],{icon:L.divIcon({className:'',iconSize:[0,0],html:'<div class="town"><i class="dot"></i><span class="lbl p-'+pos+'">'+n+'</span></div>'}),interactive:false,keyboard:false}).addTo(map));
[['New Hampshire',-72.20,43.06,'c'],['Massachusetts',-72.27,42.70,'c'],['Vermont',-72.60,43.03,'l']].forEach(([n,x,y,a]) =>
  L.marker([y,x],{icon:L.divIcon({className:'',iconSize:[0,0],html:'<div class="stname '+a+'">'+n+'</div>'}),interactive:false,keyboard:false}).addTo(map));

// Zoom-dependent sizes
let selLine=null, selPt=null;
function restyle(){
  const z=map.getZoom(), w=lerp(z,WID);
  byStatus.planned.forEach(l=>l.setStyle({weight:w,dashArray:(w*2)+' '+(w*1.5)}));
  byStatus.progress.concat(byStatus.rehab).forEach(l=>l.setStyle({weight:w}));
  hits.forEach(h=>h.setStyle({weight:Math.max(24,w+16)}));
  bridgeDots.forEach(d=>d.setRadius(lerp(z,RBR))); bizDots.forEach(d=>d.setRadius(lerp(z,RBZ)));
  const rw=lerp(z,[[8,2],[11,3],[14,4.6],[17,7]]);
  roadLines.forEach(([k,l,mz])=>l.setStyle({weight:rw*RW[k]*(mz?Math.min(1,0.55+(z-mz)*0.9):1),opacity:(z>=mz&&!vecOK)?1:0}));
  roadLabels.forEach(([m,mz])=>{ if(m._icon) m._icon.style.display=(z>=mz+0.5)?'':'none'; });
  if(selLine) selLine.setStyle({weight:w+5});
  document.getElementById('map').classList.toggle('z-lo',z<10.5);
  document.getElementById('map').classList.toggle('z-rt',z<9.7);
}
map.on('zoomend',restyle);

// Fit and limit zoom-out
const ZOOM_OUT=0.75;
const pad=()=>isMobile()?{tl:[26,124],br:[26,60]}:{tl:[70,84],br:[90,70]};
function applyLimits(){
  map.setMaxBounds(null);
  const p=pad(), z0=map.getBoundsZoom(bb,false,L.point(p.tl[0]+p.br[0],p.tl[1]+p.br[1]));
  const minZ=Math.max(6,z0-ZOOM_OUT); map.setMinZoom(minZ);
  const keepC=map.getCenter(), keepZ=map.getZoom();
  map.setView(bb.getCenter(),minZ,{animate:false});
  const mb=L.latLngBounds(map.getBounds().getSouthWest(),map.getBounds().getNorthEast()).extend(bb.pad(0.12));
  map.setView(keepC,keepZ,{animate:false}); map.setMaxBounds(mb);
}
(function(){ const p=pad(); map.fitBounds(bb,{paddingTopLeft:p.tl,paddingBottomRight:p.br,animate:false}); })();
applyLimits(); restyle();
let rt; map.on('resize',()=>{ clearTimeout(rt); rt=setTimeout(applyLimits,150); });

// Layer chips
document.querySelectorAll('.chip').forEach(ch=>ch.addEventListener('click',()=>{
  const on=ch.getAttribute('aria-pressed')!=='true', g=groups[ch.dataset.layer];
  ch.setAttribute('aria-pressed',on); on?g.addTo(map):map.removeLayer(g);
  if(!on) closeCard();
  restyle();
}));

// Detail card
const card=document.getElementById('card'), titleEl=document.getElementById('c-title'), bodyEl=document.getElementById('c-body');
const statusLine=st=>STATUS[st]?`<p class="status"><i class="sw ${st}"></i>${STATUS[st]}</p>`:'';
const directions=c=>`<a class="go" target="_blank" rel="noopener" href="https://www.google.com/maps/dir/?api=1&destination=${c[1]},${c[0]}">Get directions</a>`;
function clearSel(){ if(selLine){selLine.remove();selLine=null;} if(selPt){selPt.remove();selPt=null;} }
function openCard(o,latlng){
  clearSel();
  let body='';
  if(o.kind==='trail'){
    body=statusLine(o.p.status);
    selLine=L.polyline(o.coords.map(ll),{pane:'selp',color:C.ink,weight:lerp(map.getZoom(),WID)+5,lineCap:'round',lineJoin:'round',interactive:false}).addTo(map);
  } else {
    selPt=L.circleMarker(latlng,{pane:'pins',radius:13,color:C.ink,weight:2.5,fill:false,interactive:false}).addTo(map);
    if(o.kind==='parking') body='<p>Parking</p>'+directions(o.geom.coordinates);
    else if(o.kind==='biz') body='<p>Participating business</p>'+directions(o.geom.coordinates);
    else body=statusLine(o.p.status)||'<p>Bridge</p>';
  }
  titleEl.textContent=o.p.name; bodyEl.innerHTML=body; card.classList.add('open');
  requestAnimationFrame(()=>reveal(latlng));
}
function closeCard(){ if(!card.classList.contains('open')) return; card.classList.remove('open'); clearSel(); }
function reveal(latlng){
  const pt=map.latLngToContainerPoint(latlng), size=map.getSize(), cardH=card.offsetHeight;
  if(isMobile()){ if(pt.y>size.y-cardH-30) map.panBy([0,pt.y-(size.y-cardH)/2],{animate:true}); }
  else if(pt.x>size.x-350 && pt.y>120) map.panBy([pt.x-(size.x-350)/2,0],{animate:true});
}
document.getElementById('close').addEventListener('click',closeCard);
addEventListener('keydown',e=>{ if(e.key==='Escape') closeCard(); });
map.on('click',closeCard);
})();
</script>
</body>
</html>
